# Тестовая конфигурация для blacklist режима
# Имена сущностей должны соответствовать именам таблиц в БД
auditPolicy:
  version: "1.0"
  mode: blacklist

  onCreate: allFields
  onUpdate: delta
  onDelete: eventOnly

  entities:
    # session_caches явно отключен
    session_caches:
      enabled: false
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

    # users и orders не указаны, поэтому будут логироваться в blacklist режиме
