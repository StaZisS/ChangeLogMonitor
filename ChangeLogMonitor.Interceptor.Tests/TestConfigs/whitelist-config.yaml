# Тестовая конфигурация для whitelist режима
# Имена сущностей должны соответствовать именам таблиц в БД
auditPolicy:
  version: "1.0"
  mode: whitelist

  onCreate: allFields
  onUpdate: delta
  onDelete: eventOnly

  entities:
    # Только users и orders будут логироваться
    users:
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

    orders:
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

    # session_caches НЕ указан, поэтому не будет логироваться в whitelist режиме
