# Тестовая конфигурация для whitelist режима
auditPolicy:
  version: "1.0"
  mode: whitelist

  onCreate: allFields
  onUpdate: delta
  onDelete: eventOnly

  entities:
    # Только User и Order будут логироваться
    User:
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

    Order:
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

    # SessionCache НЕ указан, поэтому не будет логироваться в whitelist режиме
