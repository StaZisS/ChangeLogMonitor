auditPolicy:
  version: "2.0"
  mode: whitelist  # whitelist = только указанные сущности, blacklist = все кроме указанных

  # Глобальные настройки по умолчанию
  onCreate: allFields       # allFields | eventOnly | nonDefaultFields
  onUpdate: delta           # delta | fullSnapshot
  onDelete: eventOnly       # eventOnly | allFields

  # Поля, которые НИКОГДА не логируются (глобально для всех сущностей)
  globalFieldExclusions:
    - __efMigrationsHistory
    - xmin

  # Локализация
  defaultCulture: ru-RU
  defaultTimeZone: Asia/Almaty

  methodPresets:
    mask:
      # Пресет для email: user@domain.com -> us***@domain.com
      email:
        char: "*"
        keepLeft: 2
        keepRight: 0
        preserveDomain: true

      # Пресет для телефона: +77001234567 -> +7700***4567
      phone:
        char: "*"
        keepLeft: 5
        keepRight: 4

      # Пресет для карты: 4111111111111111 -> 4111********1111
      creditCard:
        char: "*"
        keepLeft: 4
        keepRight: 4

    hash:
      # Стандартный SHA-256
      standard:
        algo: SHA-256
        encoding: base64
        storeHash: true

      # Быстрый MD5 (для некритичных данных)
      fast:
        algo: MD5
        encoding: base64

  #=============================================================================
  # Политики для сущностей
  #=============================================================================
  entities:
    #---------------------------------------------------------------------------
    # Users - демонстрация: exclude, mask, allFields
    #---------------------------------------------------------------------------
    Users:
      displayName: "Пользователи"
      enabled: true
      onCreate: allFields      # При создании показывать все поля
      onUpdate: delta          # При обновлении показывать только изменения
      onDelete: allFields      # При удалении показывать все поля (для истории)

      access:
        allowedRoles: [user]

      fields:
        # PasswordHash - ИСКЛЮЧИТЬ (никогда не логировать!)
        PasswordHash:
          action: exclude

        # Email - МАСКИРОВАТЬ (показать частично)
        Email:
          action: mask
          mask:
            preset: email      # Использовать пресет email

        # FullName - обычное поле
        FullName:
          action: include

        # Username - обычное поле
        Username:
          action: include

      # Коллекция заказов пользователя
      collections:
        Orders:
          logDeltas: true
          showKeys: true
          showNames: true
          itemKeySelector: "Id"
          itemNameSelector: "Description"

    #---------------------------------------------------------------------------
    # Orders - демонстрация: hash, references, enum, allFields
    #---------------------------------------------------------------------------
    Orders:
      displayName: "Заказы"
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: eventOnly

      access:
        allowedRoles: [admin]

      fields:
        # Amount - ХЕШИРОВАТЬ
        Amount:
          action: hash
          hash:
            preset: standard   # SHA-256

        # Description - обычное поле
        Description:
          action: include

        # Status - ENUM поле с человекочитаемыми лейблами
        Status:
          action: include
          view:
            format: enum

      # Ссылка на пользователя
      references:
        User:
          showKey: true        # Показывать UserId
          showName: true       # Показывать имя пользователя
          nameSelector: "Username"
          viewTemplate: "{name} (ID: {key})"

      # Коллекция тегов заказа
      collections:
        OrderTags:
          logDeltas: true
          showKeys: true
          showNames: true
          itemKeySelector: "TagId"
          m2m:
            joinEntity: "OrderTag"
            joinFields:
              - "OrderId"
              - "TagId"
            treatJoinCudAsMembership: true

    #---------------------------------------------------------------------------
    # Tags - демонстрация: eventOnly, mask
    #---------------------------------------------------------------------------
    Tags:
      displayName: "Теги"
      enabled: true
      onCreate: eventOnly      # При создании - только событие без полей
      onUpdate: delta
      onDelete: eventOnly

      fields:
        # Name - обычное поле
        Name:
          action: include

        # Color - МАСКИРОВАТЬ (просто для демонстрации)
        Color:
          action: mask
          mask:
            char: "*"
            keepLeft: 1
            keepRight: 0

    #---------------------------------------------------------------------------
    # OrderTags - демонстрация: M2M связь, allFields на delete
    #---------------------------------------------------------------------------
    OrderTags:
      displayName: "Теги заказов"
      enabled: true
      onCreate: allFields
      onUpdate: delta
      onDelete: allFields      # При удалении показать все поля

      # Ссылки на Order и Tag
      references:
        Order:
          showKey: true
          showName: true
          nameSelector: "Description"

        Tag:
          showKey: true
          showName: true
          nameSelector: "Name"


  accessControl:
    # Включить/выключить контроль доступа (по умолчанию false)
    enabled: false

    # Поведение при неавторизованном доступе:
    # - deny: вернуть 403 Forbidden
    # - filter: вернуть пустой результат (тихая фильтрация)
    unauthorizedBehavior: deny

    roles:
      admin:
        description: "Полный доступ ко всем аудит-логам"
        allowAll: true  # Обходит все проверки

      auditor:
        description: "Может просматривать все сущности кроме чувствительных"

      manager:
        description: "Может просматривать записи подразделения"

      user:
        description: "Может просматривать только свои записи"

    users:
      "fe3eab31-1fc4-4c1f-b1f0-60bc78cb2a86":
        roles: [admin]

      "a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6":
        roles: [user]

    defaultRoles: [user]

    # Разрешить анонимный доступ (без JWT токена)
    allowAnonymous: false

    # Роли для анонимных пользователей (если allowAnonymous: true)
    anonymousRoles: []
